services:
  postgres-test:
    image: postgres:16-alpine
    container_name: sempreganhe-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: sempreganhe_test
      POSTGRES_USER: sempreganhe_test
      POSTGRES_PASSWORD: sempreganhe_test_local
    ports:
      - "55432:5432"
    volumes:
      - sempreganhe-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sempreganhe_test -d sempreganhe_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sempreganhe-postgres-test-data:
