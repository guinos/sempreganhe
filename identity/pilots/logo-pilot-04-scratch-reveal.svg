<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Piloto 04 — SempreGanhe Scratch Reveal</title>
  <desc id="desc">Cartão de raspadinha parcialmente revelado com a palavra Ganhe aparecendo.</desc>
  <rect width="720" height="220" rx="36" fill="#140B2E"/>
  <g transform="translate(48 45)">
    <rect width="132" height="130" rx="22" fill="#6D28D9"/>
    <text x="66" y="82" text-anchor="middle" fill="#FFC857" font-family="Nunito Sans,Arial,sans-serif" font-size="31" font-weight="800">GANHE</text>
    <path d="M4 43 126 18M0 70 132 44M4 98 128 71M20 125 112 101" stroke="#8B82A2" stroke-width="17" stroke-linecap="round"/>
    <path d="M10 42 126 18M3 70 132 44M5 98 128 71M21 125 112 101" stroke="#C7C1D1" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 10"/>
  </g>
  <text x="220" y="106" fill="#fff" font-family="Nunito Sans,Arial,sans-serif" font-size="54" font-weight="800">Sempre<tspan fill="#FFC857">Ganhe</tspan></text>
  <text x="224" y="144" fill="#22D3EE" font-family="Nunito Sans,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">PROMOÇÃO QUE VIRA JOGO</text>
