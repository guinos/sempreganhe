<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">SempreGanhe — Promoção que vira jogo</title>
  <desc id="desc">Logo colorido com cartão de raspadinha, dedo revelando uma estrela e o nome SempreGanhe.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B35E8"/><stop offset="1" stop-color="#35127D"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF21A"/><stop offset=".7" stop-color="#FFC107"/><stop offset="1" stop-color="#FF7A00"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF51A"/><stop offset="1" stop-color="#FF8A00"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="7"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feOffset dy="8"/></filter>
  </defs>
  <rect width="960" height="280" rx="40" fill="#140B2E"/>
