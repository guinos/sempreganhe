    <path d="M17 46h156M14 78h162M18 111h155M30 144h133" stroke="#A9A1B8" stroke-width="25" stroke-linecap="round"/>
    <path d="M18 45h154M15 78h160M19 111h153M31 144h130" stroke="#E9E5F0" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
    <path d="m95 35 13 35 38 3-29 23 9 37-31-20-32 20 10-37-30-23 38-3z" fill="url(#gold)" stroke="#FFB000" stroke-width="4"/>
    <path d="M142 3c23 12 37 32 41 55M153-7c29 15 46 39 51 68" fill="none" stroke="#11B9E9" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <path d="M108 14c-8 2-13 10-13 18v68l-20-21c-8-8-20-9-28-3-8 7-8 18-1 26l39 49c9 11 22 18 36 18h18c18 0 33-15 33-33v-48c0-9-6-16-15-16s-15 7-15 16V49c0-9-6-16-15-16s-15 7-15 16V30c0-10-8-17-18-16z" fill="#FFC2A7" stroke="#B84B38" stroke-width="5" stroke-linejoin="round"/>
