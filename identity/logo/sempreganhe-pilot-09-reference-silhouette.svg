<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">SempreGanhe — piloto silhueta de referência</title>
  <desc id="desc">Silhueta dourada inspirada na referência enviada, com os dois braços erguidos e punhos fechados.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D982"/>
      <stop offset="0.5" stop-color="#C9A24A"/>
      <stop offset="1" stop-color="#8F671C"/>
    </linearGradient>
  </defs>

  <rect width="960" height="320" rx="38" fill="#050505"/>

  <!-- Silhueta redesenhada a partir da referência visual fornecida -->
  <g transform="translate(46 25)" fill="url(#gold)">
    <!-- braço esquerdo e punho -->
    <path d="M91 121c-15-20-28-43-37-68L43 31c-4-10 1-20 10-24 8-3 17 1 20 10l10 25 7-6c7-6 17-4 21 4l4 8c5 12 4 25-3 36l-8 13 25 41Z"/>
    <!-- braço direito e punho -->
    <path d="M241 121c15-20 28-43 37-68l11-22c4-10-1-20-10-24-8-3-17 1-20 10l-10 25-7-6c-7-6-17-4-21 4l-4 8c-5 12-4 25 3 36l8 13-25 41Z"/>
    <!-- cabeça -->
    <path d="M135 75c0-24 17-42 38-42s38 18 38 42v18c0 24-17 42-38 42s-38-18-38-42Z"/>
    <path d="M139 68c3-19 16-32 34-32s31 13 34 32c-20-6-47-6-68 0Z"/>
    <!-- pescoço e torso -->
    <path d="M153 124h40v30h-40z"/>
    <path d="M153 145c-33 6-63 23-79 53l-18 99h234l-18-99c-16-30-46-47-79-53l-20 29Z"/>
  </g>

  <!-- Wordmark com larguras explícitas para evitar sobreposição -->
  <g font-family="Manrope,Arial,sans-serif" font-weight="800" letter-spacing="-1">
    <text x="380" y="143" fill="#F4EFE5" font-size="64" textLength="240" lengthAdjust="spacingAndGlyphs">Sempre</text>
    <text x="640" y="143" fill="url(#gold)" font-size="64" textLength="270" lengthAdjust="spacingAndGlyphs">Ganhe</text>
  </g>
  <text x="385" y="187" fill="#C9A24A" font-family="Manrope,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">PROMOÇÃO QUE VIRA JOGO</text>
</svg>
