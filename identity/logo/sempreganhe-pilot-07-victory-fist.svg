<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">SempreGanhe — piloto punho de vitória</title>
  <desc id="desc">Logo dourado sobre fundo preto com silhueta de uma pessoa comemorando com o punho levantado.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D982"/>
      <stop offset="0.48" stop-color="#C9A24A"/>
      <stop offset="1" stop-color="#8F671C"/>
    </linearGradient>
    <filter id="goldGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="320" rx="38" fill="#050505"/>

  <!-- Símbolo: pessoa comemorando com o punho levantado -->
  <g transform="translate(54 34)" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)">
    <!-- cabeça e pescoço -->
    <path d="M142 67c0-29 22-51 50-51s50 22 50 51-22 51-50 51-50-22-50-51Z" stroke-width="10"/>
    <path d="M164 112v30m56-30v30" stroke-width="11"/>

    <!-- ombros e tronco -->
    <path d="M75 252c4-57 36-91 89-106l28 27 28-27c53 15 85 49 89 106" stroke-width="13"/>
    <path d="M120 172c18 15 39 23 72 23s54-8 72-23" stroke-width="7" opacity=".75"/>

    <!-- braço direito levantado -->
    <path d="M248 174c25-8 43-26 52-53l24-72c5-15 18-23 30-18 12 4 17 17 13 31l-12 43" stroke-width="18"/>
    <path d="M355 106l17-59c4-13 16-20 27-16 12 4 17 16 13 29l-14 53" stroke-width="18"/>

    <!-- punho cerrado -->
    <path d="M365 112c-7-12-5-28 6-38l12-11 12-27c4-9 14-14 24-10 10 4 14 14 11 25l-5 17 15-25c6-10 18-13 27-7 9 6 11 17 5 27l-11 20 15-16c8-8 19-8 27-1 8 8 7 19 0 27l-22 24c-16 18-36 28-59 28h-24c-13 0-25-9-33-24Z" stroke-width="10"/>
    <path d="M395 82l24 13m-4-31 25 15m-4-29 23 16" stroke-width="7"/>

    <!-- linhas de celebração -->
    <path d="M396 10V0m29 16 7-10m-48 18-10-7" stroke-width="7"/>
  </g>

  <!-- wordmark -->
  <g font-family="Manrope,Arial,sans-serif" font-weight="800" letter-spacing="-2">
    <text x="390" y="145" fill="#F4EFE5" font-size="70">Sempre</text>
    <text x="650" y="145" fill="url(#gold)" font-size="70">Ganhe</text>
  </g>
  <text x="395" y="188" fill="#C9A24A" font-family="Manrope,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">PROMOÇÃO QUE VIRA JOGO</text>
</svg>
